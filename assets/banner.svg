<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1b2333" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.15" cy="0.25" r="0.65">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)" opacity="0.5"/>
  <rect width="1000" height="260" fill="url(#glow)"/>

  <rect x="0" y="0" width="6" height="260" fill="url(#accent)"/>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#8b98a9">
    <circle cx="46" cy="46" r="6" fill="#ff5f56"/>
    <circle cx="66" cy="46" r="6" fill="#ffbd2e"/>
    <circle cx="86" cy="46" r="6" fill="#27c93f"/>
    <text x="46" y="80" font-size="14" fill="#4b5768">~/portfolio &#8213; zsh</text>
  </g>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace">
    <text x="46" y="128" font-size="20" fill="#3fb950">
      <tspan fill="#7ee787">aryan</tspan><tspan fill="#8b98a9">@</tspan><tspan fill="#7ee787">devbox</tspan><tspan fill="#8b98a9">:~$</tspan> whoami
    </text>

    <text x="46" y="168" font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="0.5">
      Aryan Qayum
      <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
    </text>

    <text x="46" y="202" font-size="20" fill="#58a6ff">
      Full Stack Developer
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="330" y="202" font-size="20" fill="#4b5768">|</text>
    <text x="348" y="202" font-size="20" fill="#a5d6ff">
      Machine Learning Enthusiast
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze"/>
    </text>

    <text x="46" y="234" font-size="15" fill="#4b5768">
      B.Tech CSE &#8213; Jamia Millia Islamia
    </text>
  </g>

  <rect x="920" y="118" width="11" height="18" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
